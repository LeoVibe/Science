<body>
  <div id="root"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function restoreDeepLinkFrom404() {
      var url = new URL(window.location.href);
      var redirectPath = url.searchParams.get("__redirect");
      if (!redirectPath) return;

      // 避免重複處理 __redirect 參數 (防止無限迴圈)
      url.searchParams.delete("__redirect");

      // 確保 redirectPath 不包含重複的轉址資訊
      // 如果 redirectPath 內部又含 __redirect，只取第一層
      var cleanPath = redirectPath.split('?__redirect=')[0];

      var nextPath = cleanPath + (url.searchParams.toString() ? "?" + url.searchParams.toString() : "");

      // 使用 replaceState 避免在歷史紀錄中留下 404 轉址中間態
      window.history.replaceState(null, "", nextPath);

      // 如果從 404 導回首頁，但 URL 顯示仍是根路徑且含有 __redirect
      // 某些瀏覽器下 history.replaceState 不會觸發 React Router 的路徑更新
      // 若 pathname 目前是 "/" 且不是我們期望的目標路徑，則強制跳轉
      // 但在 /Science/ 子目錄環境，pathname 可能是 "/Science/"
      var currentPath = window.location.pathname;
      if (currentPath === '/' || currentPath === '/Science/' || currentPath === '/Science') {
        if (nextPath !== currentPath && nextPath !== (currentPath + '/')) {
          window.location.replace(nextPath);
        }
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
