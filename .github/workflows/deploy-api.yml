# 部署 backend/api (Cloudflare Worker) 至 Cloudflare
# 需在 Repo Settings > Secrets and variables > Actions 設定 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID

name: Deploy API (Cloudflare Worker)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/api/**"
      - "scripts/workers/api/**"
  workflow_dispatch:

concurrency:
  group: "deploy-api"
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate (dry-run)
        run: npx wrangler deploy --config wrangler.toml --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare
        if: success()
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
